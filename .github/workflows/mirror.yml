# Publishes the two public snapshots this monorepo is the source of truth for:
#
#   cli      → papervine/cli      (the CLI + render engine; what `npm publish` ships from)
#   starter  → papervine/starter  (the forkable example docs site)
#
# Dormant until a `MIRROR_TOKEN` secret exists. Without it the job runs, says so, and exits
# green — a missing optional secret shouldn't show up as a broken build on every push to main.
# The token needs `contents:write` on BOTH public repos; a token scoped to only one of them
# fails at the push step of the other, not here.
#
# Both targets must be seeded once, by hand, before their first automated run:
#
#     npm run mirror:cli -- --initial --push
#     npm run mirror:starter -- --initial --push
#
# That writes the `.mirror-source` stamp every later run compares against; without it the
# divergence guard refuses to publish over a repo it can't prove it created. Seeding stays
# manual deliberately — `--initial` squashes history into one commit, which is not a thing to
# automate. Both are seeded as of 2026-08-24.
#
# WHY AUTOMATING THE CLI IS SAFE. This used to mirror only the starter, on the reasoning that
# pushing the CLI moves the source an npm package is built from, and an immutable publish
# deserves a human gate. The gate is real but it isn't here: `publish.yml` in papervine/cli
# fires only on a `v*` tag or a manual dispatch, and the mirror pushes `main` alone — it never
# pushes tags. So mirroring moves the source without being able to ship it, and tagging stays
# the deliberate human act it was. What automation buys is that the tag then describes code
# that is actually public, instead of a snapshot someone remembered to push.
name: Mirror

# Triggered by CI *completing successfully*, not by the push itself. The mirrors' own validation
# is shallow — that docs.json parses, that every page the navigation names exists — while
# whether those pages render is `node tests/crawl.mjs`, and whether the CLI tarball survives
# being installed elsewhere is `npm run test:cli`. Both live in CI's `verify` job. On a plain
# `push` trigger the two race, and the loser is a forkable template with a page that 500s, or a
# published snapshot that fails on install.
#
# The cost of workflow_run is no `paths:` filter, so this runs on every successful main build.
# That's fine: each target exits with "nothing to publish" when no path it mirrors changed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    # Never publish something CI rejected. `workflow_dispatch` has no originating run, so allow
    # it through for a manual re-publish.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      # Independent repos with independent failure modes — a CLI validation failure should not
      # cancel a starter publish that would have succeeded.
      fail-fast: false
      matrix:
        target: [cli, starter]

    # One publish at a time PER TARGET. Two triggers can fire within seconds of each other — a
    # manual dispatch alongside the automatic `workflow_run` did exactly that on the first live
    # run — and two concurrent runs would race on the same push. The loser wouldn't fail cleanly
    # either: it would push a tip whose parent has moved, or trip the divergence guard on a
    # commit its sibling just made, which reads like tampering rather than a collision. Keyed on
    # the target so the two mirrors, which push to different repos, never queue behind each other.
    #
    # Deliberately NOT `cancel-in-progress`. A cancelled mirror can already have pushed some of
    # its replayed commits, leaving the repo at a real-but-partial state and the stamp behind it
    # — the next run would then see a tip it doesn't recognise. Queuing is slower and always
    # correct.
    concurrency:
      group: mirror-${{ matrix.target }}
      cancel-in-progress: false

    steps:
      - name: Is the mirror configured?
        id: gate
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "MIRROR_TOKEN is not set — skipping. Add a token with contents:write on"
            echo "papervine/${{ matrix.target }} to enable automatic publishing."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          # The mirror replays one public commit per upstream commit, so it needs real history.
          # The default depth-1 checkout would leave it nothing to replay.
          fetch-depth: 0
          # Publish exactly the commit CI passed, not whatever main has drifted to since.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.enabled == 'true'

      # The script's remotes are SSH; rewrite them to token-authenticated HTTPS rather than
      # threading a `--repo` override through, so the target stays defined in one place (the
      # script) and can't drift between here and there.
      - name: Authenticate git
        if: steps.gate.outputs.enabled == 'true'
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git config --global "url.https://x-access-token:$TOKEN@github.com/.insteadOf" \
            "git@github.com:"

      # Commits are replayed with their original author, date and message, so no bot identity
      # is needed here — the script sets user.name/user.email per commit.
      - name: Publish
        if: steps.gate.outputs.enabled == 'true'
        run: npm run mirror:${{ matrix.target }} -- --push

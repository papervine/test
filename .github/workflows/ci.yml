name: CI

on:
  push:
    branches: [main]
  pull_request:

# The verification steps below used to be one sequential `verify` job, which put ~8m20 between
# a push and a production deploy. They are mutually independent — smoke and the crawl each spawn
# their own `next dev` (their own NEXT_DIST_DIR, see next.config.mjs) so neither needs the
# production build, and the clean-room test runs its own build inside the packed tarball — so
# they now run as parallel jobs. Each pays ~50s of checkout + npm ci, but they pay it at the
# same time: the critical path becomes the slowest single job rather than the sum of all five.
#
# `verify` survives as an aggregator that needs them all, so `deploy-production` /
# `deploy-trigger` (and any branch protection naming "verify") keep working unchanged. If any
# job fails, the aggregator is skipped, and so is the deploy — which is the behavior we want.
jobs:
  checks:
    name: Typecheck + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck CLI app (apps/cli — its own tsconfig + next plugin)
        run: npx tsc --noEmit -p apps/cli/tsconfig.json

      - name: Unit tests (pure logic)
        run: npm run test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Next's own build cache. Only npm was cached before, so every build started cold.
      # Keyed on the lockfile + sources so a real change still rebuilds what it must, with
      # restore-keys so an unrelated edit reuses most of the previous compile.
      - name: Cache the Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'packages/**', 'next.config.mjs') }}
          restore-keys: |
            next-${{ hashFiles('package-lock.json') }}-
            next-

      - name: Build
        # Raise V8's old-space cap: the runner's cgroup makes Node default to ~2GB,
        # which `next build` now exceeds (OOM, exit 134). The runner has 7GB.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

  smoke:
    name: Smoke (renderer + control-plane, no DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Smoke test (renderer + control-plane gate, no DB)
        run: npm test

  crawl:
    name: Crawl the example docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The forkable example site (examples/starter → papervine/starter). It's the first thing
      # a prospective user renders, and `db:seed` builds its dev sites from it — including the
      # reader-auth test bed — so a broken page here breaks local development too. Nothing
      # verified it until it lived in this repo.
      - name: Crawl the example docs site
        run: node tests/crawl.mjs examples/starter

  cli-package:
    name: Clean-room CLI package test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Packs, audits and installs the real `papervine` tarball, then serves docs/ from
      # it. Every other job runs with the workspace's hoisted node_modules in scope, so
      # this is the only one that can catch a break that exists solely once published —
      # an undeclared dep, a symlinked Turbopack external, or the monorepo's own Sentry
      # config compiled into the CLI. Runs a full `next build`, so it's the slow one.
      - name: Clean-room CLI package test
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node tests/cli-package.mjs

  # The gate the deploy jobs wait on. Deliberately does no work of its own: it exists so the
  # five jobs above can run in parallel while `needs: verify` downstream keeps its meaning.
  verify:
    name: Verify
    needs: [checks, build, smoke, crawl, cli-package]
    runs-on: ubuntu-latest
    steps:
      - run: echo "typecheck, unit, build, smoke, crawl and the clean-room CLI test all passed"

  # Authed control-plane journeys (Playwright + real Postgres). The @external connect
  # spec hits the GitHub API, so it's skipped here to keep CI deterministic; run it
  # locally with `npm run test:e2e`.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: papervine
          POSTGRES_PASSWORD: papervine
          POSTGRES_DB: papervine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papervine" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # MinIO (S3) — same images/creds/bucket as docker-compose. A `services:` block
      # can't pass the `server /data` command the official image needs, so start it
      # directly. The dashboard overview + editor specs stream site content from it;
      # without it those specs 500 on ECONNREFUSED :9000.
      - name: Start MinIO (S3) + create bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=papervine -e MINIO_ROOT_PASSWORD=papervinesecret \
            minio/minio:latest server /data
          docker run --rm --network host --entrypoint /bin/sh minio/mc:latest -c '
            for i in $(seq 1 30); do
              mc alias set local http://127.0.0.1:9000 papervine papervinesecret && break
              sleep 1
            done
            mc mb --ignore-existing local/papervine-content && echo "bucket ready"'

      - name: E2E (deterministic — skips @external)
        run: npm run test:e2e -- --grep-invert @external

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Deploy the automations executor (SPEC §10.2). Vercel ships the Next app that
  # *enqueues* runs; the Trigger.dev tasks (automation-run, automation-cron) run on
  # Trigger.dev's cloud and only exist there once deployed — a release separate from
  # Vercel. Without this, task-code changes land on main but prod keeps executing the
  # old version (or, on first deploy, runs sit at "Pending version" forever). Gated on
  # `verify` so a bundle that fails typecheck/unit/build/smoke never reaches prod, and
  # only on a real push to main (never PRs). Needs a TRIGGER_ACCESS_TOKEN repo secret
  # (Trigger.dev dashboard → your profile → Personal Access Tokens); absent → the step
  # no-ops with a notice instead of failing the run, so forks/unconfigured repos stay
  # green. trigger.dev v4 builds remotely, so no Docker on the runner.
  deploy-trigger:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy Trigger.dev tasks
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
          # When set, trigger.config.ts mirrors the Vercel project's env into the matching
          # Trigger environment at deploy time (see the vercelEnvSync note there), so the
          # executor's DATABASE_URL / S3 / AI / GitHub-App config never drifts from the app.
          # Absent → the sync is skipped and the executor's env must be set by hand in the
          # Trigger.dev dashboard. VERCEL_TEAM_ID is only needed for team-scoped projects.
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          if [ -z "$TRIGGER_ACCESS_TOKEN" ]; then
            echo "::notice::TRIGGER_ACCESS_TOKEN not set — skipping executor deploy. Add it in Settings → Secrets and variables → Actions to enable automated deploys."
            exit 0
          fi
          # Pin the CLI to the installed SDK version — `trigger.dev deploy` aborts on any
          # CLI/@trigger.dev/* version drift. Deriving it from the installed package keeps
          # them in lockstep with a single source of truth (package.json), no second bump.
          VERSION="$(node -p "require('@trigger.dev/sdk/package.json').version")"
          echo "Deploying with trigger.dev@${VERSION}"
          npx "trigger.dev@${VERSION}" deploy

  # Deploy the Next app to Vercel production.
  #
  # Vercel's Git integration deploys the instant it sees a push, in parallel with this
  # workflow and with no knowledge of it — so a commit that fails the tests below still
  # went live, and a red CI run sat next to a green production deploy. `next build` failing
  # was the only thing that ever stopped a bad deploy, which catches type and compile
  # errors and nothing else: not the unit tests, not the smoke gate, not the e2e journeys.
  #
  # So automatic deploys are turned OFF for `main` (vercel.json → git.deploymentEnabled)
  # and this job is the only path to production. Branch and PR previews are untouched —
  # they still auto-deploy, and gating them would remove the thing they're for.
  #
  # Gated on `verify` — typecheck, unit, build, smoke, the example-site crawl and the
  # clean-room CLI package. Deterministic, and every one of them is a real signal.
  #
  # `e2e` was in this list for exactly one push and had to come out. It is not stable enough
  # to gate a deploy: run 32896746146 passed WITH 3 flaky tests (failed, passed on retry),
  # and run 32897972504 — a commit touching only vercel.json and three markdown files —
  # failed `widget-settings.spec.ts:31` on both attempts with
  # `ERR_ABORTED; maybe frame was detached?`. Same code, opposite verdicts twelve minutes
  # apart. Gating on that doesn't mean "don't ship broken code", it means "shipping is a coin
  # flip", and the first thing it blocked was a docs-only commit.
  #
  # So e2e still has to be green to merge — it just doesn't hold the deploy. Put it back the
  # day that spec is fixed; the gap until then is the authed dashboard journeys. What is NOT
  # the answer is `continue-on-error`, which would make this job green while shipping the
  # failure it exists to catch.
  deploy-production:
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No `npm ci`: the build runs on Vercel (remote build), which is what keeps
      # vercel.json's buildCommand — `drizzle-kit migrate && sync-billing && next build` —
      # the single definition of how production is built. Building here instead would fork it.
      - name: Deploy to Vercel (production)
        env:
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          # The CLI reads these two from the environment to know what it's deploying, in
          # place of a checked-in .vercel/project.json. ORG_ID is the team id for a
          # team-scoped project (which this is — the secret already exists for the
          # Trigger.dev env sync above).
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          # Fail LOUD, never skip. The Trigger.dev job above exits 0 when unconfigured
          # because a missing executor deploy degrades to "prod keeps running the old
          # tasks". Here a skip would mean production silently stops receiving deploys at
          # all — strictly worse than the auto-deploy this replaces.
          for var in VERCEL_ACCESS_TOKEN VERCEL_PROJECT_ID VERCEL_ORG_ID; do
            if [ -z "${!var}" ]; then
              echo "::error::$var is not set, and production deploys now go through this job — so this cannot be skipped. Add it under Settings → Secrets and variables → Actions (VERCEL_ORG_ID comes from the VERCEL_TEAM_ID secret)."
              exit 1
            fi
          done
          # Pinned to a major: this is the production deploy path, and `@latest` would let a
          # CLI release change how it behaves without a commit here.
          npx vercel@59 deploy --prod --yes --token="$VERCEL_ACCESS_TOKEN"

# Crawling *external* docs repos still lives in tests/crawl.mjs and is run locally —
# see README → Testing. It stays out of CI because it clones a third-party repo per
# run, so a red build could mean their content changed rather than ours; the fixtures
# smoke test above encodes the same regression cases deterministically.
#
# `examples/starter` is the exception, and is crawled in `verify` above: it's *our*
# content, committed here, so it's as deterministic as the fixtures — and it's the repo
# people fork and the one `db:seed` builds its dev sites from, so a page that stops
# rendering breaks both the first impression and local development. Booting a dev server
# on a runner is already proven by the smoke gate, which does the same thing.

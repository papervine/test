# Publishes examples/starter → the public papervine/starter repo.
#
# Dormant until a `MIRROR_TOKEN` secret exists. Without it the job runs, says so, and exits
# green — a missing optional secret shouldn't show up as a broken build on every push to main.
#
# ONE MANUAL STEP FIRST. papervine/starter already has content this script didn't create, so the
# divergence guard will refuse to publish over it:
#
#     mirror: .mirror-source is missing from the public repo, so I can't tell what it reflects.
#
# Seed it once, by hand, from a checkout:
#
#     npm run mirror:starter -- --initial --push
#
# That writes the `.mirror-source` stamp every later run compares against. It stays manual
# deliberately: `--initial` squashes history into one commit, which is not a thing to automate.
# Until it's done, this workflow fails loudly rather than guessing.
#
# Only the starter is automated. The CLI mirror stays manual on purpose: pushing it moves the
# source that papervine/cli's own publish workflow builds an npm package from, and a human gate
# in front of an immutable npm publish is worth keeping. Docs are the opposite — cheap to fix,
# and exactly the thing that rots when publishing depends on someone remembering.
name: Mirror starter

# Triggered by CI *completing successfully*, not by the push itself. The mirror's own validation
# only checks that docs.json parses and that every page its navigation names exists; whether
# those pages actually render is `node tests/crawl.mjs examples/starter`, which lives in CI. On a
# plain `push` trigger the two race, and the loser is a forkable template with a page that 500s.
#
# The cost of workflow_run is no `paths:` filter, so this runs on every successful main build.
# That's fine: the mirror exits with "nothing to publish" when no mirrored path changed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    # Never publish something CI rejected. `workflow_dispatch` has no originating run, so allow
    # it through for a manual re-publish.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Is the mirror configured?
        id: gate
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "MIRROR_TOKEN is not set — skipping. Add a token with contents:write on"
            echo "papervine/starter to enable automatic publishing."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          # The mirror replays one public commit per upstream commit, so it needs real history.
          # The default depth-1 checkout would leave it nothing to replay.
          fetch-depth: 0
          # Publish exactly the commit CI passed, not whatever main has drifted to since.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.enabled == 'true'

      # The script's remotes are SSH; rewrite them to token-authenticated HTTPS rather than
      # threading a `--repo` override through, so the target stays defined in one place (the
      # script) and can't drift between here and there.
      - name: Authenticate git
        if: steps.gate.outputs.enabled == 'true'
        env:
          TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git config --global "url.https://x-access-token:$TOKEN@github.com/.insteadOf" \
            "git@github.com:"

      # Commits are replayed with their original author, date and message, so no bot identity
      # is needed here — the script sets user.name/user.email per commit.
      - name: Publish
        if: steps.gate.outputs.enabled == 'true'
        run: npm run mirror:starter -- --push

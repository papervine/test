name: Publish

# Publishes @papervine/renderer + papervine to npm with provenance. Dormant until
# you deliberately trigger it: push a version tag (e.g. `v0.1.0`) or run it manually
# from the Actions tab. Requires an `NPM_TOKEN` repo secret (an npm automation token
# with publish rights). `id-token: write` lets npm attach build provenance via OIDC.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for `npm publish --provenance`
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # Gate the release on the same checks CI runs, so a tag can never ship a
      # broken renderer.
      - name: Typecheck
        run: npm run typecheck

      - name: Smoke test
        run: npm test

      # The CLI depends on the renderer, so publish the renderer first. `--access
      # public` is required for the scoped @papervine/renderer's first publish (and
      # harmless thereafter / for the unscoped papervine).
      - name: Publish @papervine/renderer
        run: npm publish --workspace @papervine/renderer --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish papervine
        run: npm publish --workspace papervine --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

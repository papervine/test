# Local dev services for the Docbot control plane.
# Prod swaps these for managed equivalents (Neon for Postgres, R2 for object
# storage) — code targets the same interfaces (DATABASE_URL / S3 API), so only
# env changes. Postgres ships with pgvector for the AI assistant's embeddings.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docbot
      POSTGRES_PASSWORD: docbot
      POSTGRES_DB: docbot
    ports:
      - "5432:5432"
    volumes:
      - docbot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docbot -d docbot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3 (object storage) — prod uses Cloudflare R2; same S3 API (SPEC §3.1, §11).
  # Compiled/copied tenant content + assets live here. Console at :9001.
  minio:
    image: minio/minio:latest
    container_name: docbot-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: docbot
      MINIO_ROOT_PASSWORD: docbotsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - docbot-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Create the bucket on startup so the app doesn't have to.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 docbot docbotsecret &&
      mc mb --ignore-existing local/docbot-content &&
      echo 'bucket ready'
      "

volumes:
  docbot-pgdata:
  docbot-miniodata:

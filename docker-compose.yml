# Local dev services for the Papervine control plane.
# Prod swaps these for managed equivalents (Neon for Postgres, R2 for object
# storage) — code targets the same interfaces (DATABASE_URL / S3 API), so only
# env changes. Postgres ships with pgvector for the AI assistant's embeddings.
name: papervine
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: papervine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: papervine
      POSTGRES_PASSWORD: papervine
      POSTGRES_DB: papervine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papervine -d papervine"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local S3 (object storage) — prod uses Cloudflare R2; same S3 API (SPEC §3.1, §11).
  # Compiled/copied tenant content + assets live here. Console at :9001.
  minio:
    image: minio/minio:latest
    container_name: papervine-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: papervine
      MINIO_ROOT_PASSWORD: papervinesecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Create the bucket on startup so the app doesn't have to.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 papervine papervinesecret &&
      mc mb --ignore-existing local/papervine-content &&
      echo 'bucket ready'
      "

  # Realtime (Pusher protocol, SPEC §10.3) — self-hosted Soketi, a drop-in Pusher-compatible
  # WebSocket server. Prod swaps it for hosted Pusher Channels: same client/server SDKs, only
  # env changes (the same pattern as Postgres→Neon and S3→R2). Drives the live Activity feed.
  # The app id/key/secret here must match PUSHER_*/NEXT_PUBLIC_PUSHER_* in .env.local.
  soketi:
    image: quay.io/soketi/soketi:1.6-16-alpine
    container_name: papervine-soketi
    restart: unless-stopped
    environment:
      SOKETI_DEFAULT_APP_ID: papervine
      SOKETI_DEFAULT_APP_KEY: papervine-key
      SOKETI_DEFAULT_APP_SECRET: papervine-secret
      # Clients only subscribe + receive server-published events; they never publish directly.
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "false"
    ports:
      - "6001:6001" # WebSocket + HTTP trigger API
      - "9601:9601" # metrics/health

  # Collaborative editing socket (SPEC §9.2) — standalone Hocuspocus (Yjs CRDT) server, the
  # always-on piece Vercel can't host. The Next app mints a per-room token (gateEditor → HS256
  # over COLLAB_JWT_SECRET); this service only verifies it. Prod runs the same image on a
  # container host (Fly/Railway/Render); self-hosters run exactly this. Set the SAME
  # COLLAB_JWT_SECRET here and in .env.local, and NEXT_PUBLIC_COLLAB_URL=ws://127.0.0.1:1234.
  collab:
    build:
      context: ./apps/collab
    container_name: papervine-collab
    restart: unless-stopped
    environment:
      COLLAB_PORT: "1234"
      COLLAB_JWT_SECRET: ${COLLAB_JWT_SECRET:-papervine-collab-dev-secret}
    ports:
      - "1234:1234" # Yjs WebSocket

  # Self-hosted inference (SPEC §18) — OPT-IN, never part of a plain `docker compose up`:
  #   docker compose --profile local-ai up -d
  #   docker compose --profile local-ai exec ollama ollama pull qwen3
  # Then set AI_ROUTING=direct and PAPERVINE_AI_MODEL=ollama/<model>. Deliberately not a
  # default service: the model weights are multi-GB, and Docker on macOS can't reach the
  # GPU (Mac users are better off with the native Ollama app — the URL is the same).
  ollama:
    image: ollama/ollama:latest
    container_name: papervine-ollama
    profiles: [local-ai]
    restart: unless-stopped
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "11434:11434" # OpenAI-compatible API at /v1

volumes:
  pgdata:
  miniodata:
  ollamadata:
